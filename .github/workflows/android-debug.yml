name: Android Debug

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22.23.2
      cache: npm

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install dependencies
    run: npm ci

  - name: Restore Firebase Android configuration
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    run: |
      if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
        printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
        node -e "const c=require('./google-services.json').client||[]; if(!c.some(x=>x.client_info?.android_client_info?.package_name==='co.za.chefu.nook')) process.exit(1)"
        echo "GOOGLE_SERVICES_JSON=google-services.json" >> "$GITHUB_ENV"
      else
        echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured; Android push registration will be skipped."
      fi

  - name: Generate native Android project
    run: npx expo prebuild --platform android --non-interactive

  - name: Build debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: android-debug-apk
      path: android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14